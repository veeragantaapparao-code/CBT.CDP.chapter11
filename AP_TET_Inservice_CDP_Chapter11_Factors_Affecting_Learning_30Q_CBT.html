<div class="actions"><div class="group"><button class="secondary" id="prevBtn">← Previous</button><button class="primary" id="nextBtn">Next →</button></div><div class="group"><button class="accent" id="submitBtn">Submit Test</button></div></div><p class="small">ప్రతి ప్రశ్నకు ఒక సమాధానాన్ని ఎంచుకోండి. Submit Test నొక్కితే స్కోర్, సరైన సమాధానాలు, వివరణలు కనిపిస్తాయి.</p></section>

<script>
const questions=[{"q": "అభ్యసనాన్ని ప్రభావితం చేసే ప్రధాన అంశాలు ఏవి?", "options": ["కేవలం పాఠ్యపుస్తకం", "అభ్యాసకుడు, ఉపాధ్యాయుడు, బోధనా విధానం, పరిసరాలు మరియు ఆరోగ్యం", "కేవలం పరీక్ష సమయం", "కేవలం తరగతి గది పరిమాణం"], "answer": 1, "explanation": "అభ్యసనంపై అభ్యాసకుని లక్షణాలు, ప్రేరణ, ఆరోగ్యం, ఉపాధ్యాయుని పద్ధతులు, కుటుంబం, పాఠశాల వాతావరణం వంటి అనేక అంశాలు ప్రభావం చూపుతాయి."}, {"q": "అంతర్గత (Intrinsic) ప్రేరణకు ఉదాహరణ ఏది?", "options": ["బహుమతి కోసం చదవడం", "శిక్ష తప్పించుకోవడానికి చదవడం", "విషయంపై ఆసక్తి వల్ల నేర్చుకోవడం", "మార్కుల కోసం మాత్రమే చదవడం"], "answer": 2, "explanation": "Intrinsic motivation అనేది నేర్చుకోవడంలోనే ఆసక్తి, ఆనందం లేదా వ్యక్తిగత సంతృప్తి ఉండటం."}, {"q": "బాహ్య (Extrinsic) ప్రేరణకు ఉదాహరణ ఏది?", "options": ["తెలుసుకోవాలనే ఆసక్తితో చదవడం", "బహుమతి లేదా మార్కుల కోసం చదవడం", "స్వీయ ఆసక్తితో ప్రయోగం చేయడం", "కొత్త విషయం తెలుసుకొని ఆనందించడం"], "answer": 1, "explanation": "Extrinsic motivation బాహ్య ఫలితాలు, బహుమతులు, మార్కులు లేదా శిక్షను తప్పించుకోవడం వంటి అంశాలపై ఆధారపడుతుంది."}, {"q": "అభ్యసనానికి సిద్ధత (Readiness) అంటే ఏమిటి?", "options": ["అభ్యాసకుడు నేర్చుకోవడానికి అవసరమైన మానసిక, శారీరక మరియు అనుభవపూర్వకంగా సిద్ధంగా ఉండటం", "పరీక్షను పూర్తిగా తొలగించడం", "విద్యార్థిని నిశ్శబ్దంగా ఉంచడం", "ఒకే పద్ధతిలో బోధించడం"], "answer": 0, "explanation": "Readiness అనేది నేర్చుకునే పనికి తగిన స్థాయి అభివృద్ధి, పూర్వజ్ఞానం, ఆసక్తి మరియు సిద్ధత కలిగి ఉండటం."}, {"q": "పూర్వజ్ఞానం (Prior knowledge) కొత్త అభ్యసనానికి ఎలా సహాయపడుతుంది?", "options": ["కొత్త భావనలను పాత జ్ఞానంతో అనుసంధానించడానికి సహాయపడుతుంది", "కొత్త విషయాలన్నింటినీ అడ్డుకుంటుంది", "జ్ఞాపకశక్తిని ఎప్పుడూ తగ్గిస్తుంది", "ప్రేరణను పూర్తిగా తొలగిస్తుంది"], "answer": 0, "explanation": "కొత్త సమాచారాన్ని ఇప్పటికే తెలిసిన విషయాలతో అనుసంధానించడం అర్థవంతమైన అభ్యసనానికి దోహదం చేస్తుంది."}, {"q": "విద్యార్థి తరగతిలో భయపడుతూ ఉంటే అతని అభ్యసనంపై ఏమి ప్రభావం ఉండవచ్చు?", "options": ["ఎటువంటి ప్రభావమూ ఉండదు", "ఏకాగ్రత, పాల్గొనడం మరియు జ్ఞాపకధారణ దెబ్బతినవచ్చు", "అభ్యసనం తప్పనిసరిగా పెరుగుతుంది", "అతని సామర్థ్యం శాశ్వతంగా నిర్ణయించబడుతుంది"], "answer": 1, "explanation": "అధిక భయం లేదా ఒత్తిడి ఏకాగ్రత, ప్రశ్నలు అడగడం, జ్ఞాపకధారణను తగ్గించవచ్చు. సురక్షితమైన వాతావరణం అభ్యసనానికి అనుకూలం."}, {"q": "తగినంత నిద్ర మరియు పోషకాహారం అభ్యసనానికి ఎందుకు ముఖ్యమైనవి?", "options": ["అవి శ్రద్ధ, ఆరోగ్యం మరియు జ్ఞాపక ప్రక్రియలకు మద్దతు ఇస్తాయి", "అవి ఉపాధ్యాయుడి అవసరాన్ని తొలగిస్తాయి", "అవి పాఠ్యాంశాన్ని స్వయంగా నేర్పిస్తాయి", "అవి అన్ని విద్యార్థులను ఒకేలా చేస్తాయి"], "answer": 0, "explanation": "నిద్ర, పోషకాహారం మరియు శారీరక ఆరోగ్యం శ్రద్ధ, శక్తి, భావోద్వేగ నియంత్రణ మరియు జ్ఞాపక ప్రక్రియలకు మద్దతు ఇస్తాయి."}, {"q": "అభ్యసనంలో ఉపాధ్యాయుని పాత్రకు ఉత్తమ ఉదాహరణ ఏది?", "options": ["అన్ని విద్యార్థులకు ఒకే వేగంతో బోధించి ముందుకు వెళ్లడం", "విద్యార్థుల అవసరాలు గుర్తించి, తగిన మార్గదర్శకత్వం మరియు అభిప్రాయం ఇవ్వడం", "తప్పులకు మాత్రమే శిక్ష విధించడం", "విద్యార్థుల ప్రశ్నలను నిషేధించడం"], "answer": 1, "explanation": "ఉపాధ్యాయుడు అభ్యసనానికి మార్గనిర్దేశకుడు. విద్యార్థుల అవసరాలను గుర్తించి, స్పష్టమైన బోధన, అభ్యాస అవకాశాలు, అభిప్రాయం ఇవ్వాలి."}, {"q": "అనుకూలమైన తరగతి గది వాతావరణం ఏది?", "options": ["భయపెట్టే, అవమానించే వాతావరణం", "ప్రశ్నలు అడగడానికి, తప్పుల నుంచి నేర్చుకోవడానికి సురక్షితమైన వాతావరణం", "విద్యార్థుల మధ్య నిరంతర పోలికలు", "సహకారాన్ని నిరుత్సాహపరిచే వాతావరణం"], "answer": 1, "explanation": "గౌరవం, భద్రత, పాల్గొనడం మరియు తప్పుల నుంచి నేర్చుకునే అవకాశం ఉన్న వాతావరణం అభ్యసనాన్ని ప్రోత్సహిస్తుంది."}, {"q": "వ్యక్తిగత భేదాలు (Individual differences) బోధనలో ఎందుకు పరిగణించాలి?", "options": ["అందరూ ఒకే విధంగా నేర్చుకుంటారు కాబట్టి", "విద్యార్థుల సామర్థ్యాలు, ఆసక్తులు, వేగం, నేపథ్యాలు భిన్నంగా ఉంటాయి కాబట్టి", "పాఠ్యాంశం అవసరం లేదు కాబట్టి", "పరీక్షలు రద్దు చేయాలి కాబట్టి"], "answer": 1, "explanation": "విద్యార్థుల పూర్వజ్ఞానం, ఆసక్తి, అభ్యసన వేగం మరియు అవసరాలు భిన్నంగా ఉంటాయి. బోధనలో తగిన వైవిధ్యం అవసరం."}, {"q": "అభ్యసనంలో Feedback (అభిప్రాయం) అత్యంత ఉపయోగకరంగా ఉండేది ఎప్పుడు?", "options": ["స్పష్టంగా, సమయానికి, మెరుగుపరచే మార్గం సూచించినప్పుడు", "విద్యార్థిని అవమానించినప్పుడు", "పరీక $('prevBtn').onclick=()=>{if(current>0){current--;render()}};$('nextBtn').onclick=()=>{if(current<questions.length-1){current++;render()}};
$('submitBtn').onclick=()=>{let blank=selected.filter(v=>v===null).length;if(confirm(blank?`ఇంకా ${blank} ప్రశ్నలకు సమాధానం లేదు. అయినా సమర్పించాలా?`:'పరీక్షను సమర్పించాలా?'))showResults()};
function showResults(){let score=selected.reduce((s,a,i)=>s+(a===questions[i].answer?1:0),0),wrong=selected.reduce((s,a,i)=>s+(a!==null&&a!==questions[i].answer?1:0),0),blank=selected.filter(a=>a===null).length;$('summary').innerHTML=`<div class="scorebox"><div class="stat">స్కోర్<b>${score} / ${questions.length}</b></div><div class="stat">శాతం<b>${(score/questions.length*100).toFixed(1)}%</b></div><div class="stat">తప్పు సమాధానాలు<b>${wrong}</b></div><div class="stat">సమాధానం ఇవ్వనివి<b>${blank}</b></div></div>`;$('review').innerHTML='';questions.forEach((item,i)=>{let c=item.answer,a=selected[i],d=document.createElement('div');d.className='review';let h=document.createElement('h3');h.textContent=`${i+1}. ${item.q}`;d.append(h);let p=document.createElement('p');p.innerHTML='<b>మీ సమాధానం:</b> ';let s=document.createElement('span');s.className=a===c?'correct':'incorrect';s.textContent=a===null?'సమాధానం ఇవ్వలేదు':String.fromCharCode(65+a)+'. '+item.options[a];p.append(s);d.append(p);let p2=document.createElement('p');p2.innerHTML='<b>సరైన సమాధానం:</b> ';let s2=document.createElement('span');s2.className='correct';s2.textContent=String.fromCharCode(65+c)+'. '+item.options[c];p2.append(s2);d.append(p2);let p3=document.createElement('p');p3.innerHTML='<b>వివరణ:</b> ';let s3=document.createElement('span');s3.textContent=item.explanation;p3.append(s3);d.append(p3);$('review').append(d)});$('testPanel').classList.add('hidden');$('results').classList.remove('hidden');window.scrollTo(0,0)}
$('restartBtn').onclick=()=>{if(confirm('మళ్లీ ప్రారంభించాలా?')){current=0;selected=Array(questions.length).fill(null);$('results').classList.add('hidden');$('testPanel').classList.remove('hidden');render();window.scrollTo(0,0)}};render();
</script></body></html>
